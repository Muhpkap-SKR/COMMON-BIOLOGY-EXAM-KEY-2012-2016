ส/ไรโบส) และเบสไพริมิดีน (DNA มี T, RNA มี U) สิ่งที่เหมือนกันจึงมีเพียง <b>เบสพิวรีน (A และ G)</b>", "3": "ข้อนี้ดูโครงสร้างจากรูปในข้อสอบ เฉลยคือข้อ 4 (น้ำตาลเฮกโซสและน้ำตาลกลุ่มคีโตน เช่น ฟรักโทส) วิธีดู: นับคาร์บอนในวง/สายโซ่ (6 ตัว = hexose, 5 ตัว = pentose) แล้วดูหมู่ C=O ถ้าอยู่ปลายสายเป็น aldehyde ถ้าอยู่กลางสายเป็น ketone", "6": "ที่ 100x เส้นผ่านศูนย์กลางจอภาพ = 1.6 มม. = 1,600 ไมโครเมตร เมื่อขยายเป็น 400x (มากขึ้น 4 เท่า) ขนาดจริงที่เห็นเต็มจอลดเหลือ 1,600 ÷ 4 = 400 ไมโครเมตร พารามีเซียมยาวครึ่งจอ = 400 ÷ 2 = <b>200 ไมโครเมตร</b>", "7": "RNA มากใน <b>ไรโบโซม</b> (มี rRNA ประมาณ 60% ของมวลไรโบโซม) และ <b>นิวคลีโอลัส</b> (บริเวณสร้าง rRNA) ส่วนไลโซโซมและเซนโทรโซมไม่ได้มี RNA เป็นองค์ประกอบหลัก", "8": "โปรตีนไข่แดงเป็นโมเลกุลใหญ่ที่จับกับ <b>ตัวรับเฉพาะบนเยื่อหุ้มเซลล์</b> ก่อนถูกนำเข้าเป็นเวสิเคิล จึงเป็น receptor-mediated endocytosis ซึ่งต่างจาก pinocytosis ที่กลืนสารรอบข้างโดยไม่เลือก", "9": "ข้อนี้ดูภาพเซลล์ในข้อสอบ เฉลยคือข้อ 4 หลักคือเรียงตามลำดับ prophase → metaphase → anaphase → telophase โดยดูว่าโครโมโซมหดสั้น เรียงกลางเซลล์ แยกไปสองขั้ว และเริ่มสร้างเยื่อหุ้มนิวเคลียสใหม่", "10": "โฮโมโลกัสโครโมโซมเริ่มจับคู่กัน (synapsis) และเกิด crossing over ใน <b>prophase I</b> ของไมโอซิส ส่วน interphase เป็นช่วงจำลอง DNA เท่านั้น", "11": "<b>Gastrin</b> สร้างจากเซลล์ผนังกระเพาะอาหารเอง ทำหน้าที่กระตุ้นการหลั่ง HCl และ pepsinogen ส่วน secretin กระตุ้นตับอ่อนให้หลั่งไบคาร์บอเนต และ bile salt ช่วยย่อยไขมัน", "12": "กระเพาะวัวมี 4 ส่วน (rumen, reticulum, omasum, abomasum) ส่วนที่หลั่งกรดและเอนไซม์ย่อยโปรตีนเหมือนกระเพาะคนคือ <b>abomasum</b> (กระเพาะแท้) ส่วนอื่นเป็นที่หมักด้วยจุลินทรีย์", "13": "ข้อนี้ดูข้อมูลในข้อสอบ เฉลยคือข้อ 5 ปฏิกิริยาคายพลังงาน (exergonic) คือสารตั้งต้นมีพลังงานรวมสูงกว่าผลิตภัณฑ์ ΔG ติดลบ และปลดปล่อยพลังงานออกมา", "14": "เฉลยคือข้อ 3: NADH ถูกออกซิไดส์กลับเป็น NAD+ ที่ complex I บนเยื่อหุ้มชั้นใน (inner membrane) ของไมโทคอนเดรีย <b>ข้อสังเกต:</b> ข้อ 1 ก็เป็นจริงเช่นกัน เพราะไกลโคไลซิสสร้าง NADH ในไซโทพลาสซึม ข้อนี้จึงน่าตรวจเทียบกับเฉลยทางการอีกครั้ง", "15": "ไกลโคไลซิสให้ 2 ATP และ 2 NADH จากนั้นการหมักแบบเอทานอลเปลี่ยนไพรูเวตเป็นเอทานอลและ <b>CO2</b> พร้อมใช้ NADH กลับเป็น NAD+ จึงไม่เหลือ NADH สุทธิ ผลิตภัณฑ์สุทธิคือ <b>CO2 และ ATP</b>", "16": "หายใจเข้า 5 ลิตรใน 10 นาที ดังนั้นใน 60 นาทีเข้า 30 ลิตร O2 ในอากาศ 20% = 30 × 0.20 = <b>6.0 ลิตร</b> (ข้อมูล 20 ครั้งต่อนาทีเป็นตัวลวง ไม่ต้องใช้)", "17": "ตอนหายใจเข้า กะบังลม <b>หดตัว</b> และแบนลงเพื่อขยายช่องอก ข้อ 4 ที่บอกว่ากะบังลมคลายตัวและยืดเข้าไปในช่องอกเป็นลักษณะของการหายใจออก ข้อนี้จึงไม่เป็นความจริง", "18": "นกขับ <b>กรดยูริก</b> (uric acid) ซึ่งละลายน้ำน้อย ช่วยประหยัดน้ำและลดน้ำหนักตัว ส่วนหนู (สัตว์เลี้ยงลูกด้วยนม) ขับ <b>ยูเรีย</b> ตรงกับเฉลยข้อ 5 (ดูตัวเลือกในรูปของข้อสอบ)", "19": "ก ผิด: เลือดใน renal vein มีของเสียน้อยกว่า renal artery เพราะผ่านการกรองแล้ว / ข ถูก: กลูโคสและกรดอะมิโนดูดกลับที่ท่อขดส่วนต้น / ค ผิด: ของเหลวใน Bowman's capsule ไม่มีโปรตีนขนาดใหญ่ / ง ถูก: ไตข้างที่เหลือทำงานชดเชยจึงผลิตปัสสาวะใกล้เคียงเดิม ตอบ <b>ข และ ง</b>", "20": "ฮอร์โมนที่ละลายในไขมัน (steroid) ผ่านเยื่อหุ้มเซลล์ได้ และมีตัวรับในไซโทพลาสซึม ได้แก่ <b>เอสโทรเจน และ กลูโคคอร์ติคอยด์</b> ส่วนแอซิทิลโคลีนและอินซูลินละลายน้ำ ต้องจับกับตัวรับที่เยื่อหุ้มเซลล์", "21": "ซีรัมคือส่วนของเหลวในเลือดหลังเลือดแข็งตัว <b>ไฟบริโนเจน</b> ถูกใช้ไปสร้างเป็นไฟบริน (ลิ่มเลือด) ซีรัมจึงไม่มีไฟบริโนเจน ส่วนพลาสมามี เม็ดเลือดไม่มีทั้งในพลาสมาและซีรัม ตอบข้อ 2 (ข้อความ 2 อย่างเดียวถูก)", "22": "ข้อนี้ดูตารางผลการผสมในข้อสอบ เฉลยคือข้อ 3 (Y = AB, Z = O) หลักคิด: ซีรัมมีแอนติบอดี ถ้าเลือดแดงตกตะกอน (agglutinate) แสดงว่าซีรัมมีแอนติบอดีต่อแอนติเจนบนเม็ดเลือดแดงนั้น คนหมู่ AB ไม่มีแอนติบอดีในซีรัม ส่วนหมู่ O มีทั้ง anti-A และ anti-B แต่ไม่มีแอนติเจนบนเม็ดเลือดแดง", "23": "เลือดออกซิเจนต่ำคือเลือดที่กำลังกลับสู่ปอด ได้แก่ <b>ซูพีเรียเวนาคาวา</b> (นำเลือดจากร่างกายเข้าห้องบนขวา) และ <b>พัลโมนารีอาร์เตอรี</b> (ส่งไปปอด) ส่วนเอออร์ตาและพัลโมนารีเวนมีออกซิเจนสูง", "24": "ไขกระดูกและไทมัสเป็นแหล่งสร้างและพัฒนาลิมโฟไซต์ ส่วนบริเวณที่ลิมโฟไซต์อยู่มากเพื่อรอเจอสิ่งแปลกปลอมคือ <b>ม้ามและต่อมน้ำเหลือง</b> ซึ่งเป็นอวัยวะน้ำเหลืองส่วนปลาย", "25": "วัคซีนกระตุ้นให้สร้างเซลล์ B และ T ชนิด <b>เมมโมรีเซลล์</b> ที่จำเพาะต่อเชื้อ เมื่อรับเชื้อจริงจะตอบสนองได้เร็วและแรง ส่วนแอนติบอดีในเลือดจะลดลงตามเวลา จึงไม่ได้สูงตลอด", "26": "ไบเซฟกับไตรเซฟทำงานตรงข้ามกัน (antagonism) <b>งอแขน</b> = ไบเซฟหดและไตรเซฟคลาย ส่วนเหยียดแขน = ไตรเซฟหดและไบเซฟคลาย ตัวเลือกที่ถูกคือข้อ 3 (ข้อ 1 สลับกัน)", "27": "ข้อศอกเป็นข้อต่อ <b>แบบบานพับ</b> (งอ-เหยียดทิศทางเดียว) ส่วนข้อต่อระหว่างกระดูกคอชิ้นที่ 1 กับ 2 เป็นแบบ <b>เดือย</b> (pivot) ให้หมุนหันหน้าได้", "28": "การเคลื่อนที่ใช้โปรตีนกลุ่ม <b>actin, myosin</b> (กล้ามเนื้อ) และ <b>dynein</b> (ซิเลียและแฟลเจลลัมในโปรโตซัวและสัตว์ไม่มีกระดูกสันหลัง) ส่วนฮีโมโกลบินขนส่งออกซิเจน อินซูลินเป็นฮอร์โมน คอลลาเจนเป็นโครงสร้าง", "29": "ไส้เดือนมีกล้ามเนื้อ <b>วง</b> (หดแล้วตัวยาวเรียว) และ <b>ตามยาว</b> (หดแล้วตัวสั้นอ้วน) ทำงานสลับกันบนโครงร่างน้ำ (hydrostatic skeleton) จึงเคลื่อนที่เป็นระลอกคลื่น ส่วนเฟล็กเซอร์/เอ็กซ์เทนเซอร์เป็นกล้ามเนื้อแขนขา", "30": "ข้อ 1 <b>ไม่ถูก</b> เพราะโครงร่างภายใน (endoskeleton) พบในสัตว์ไม่มีกระดูกสันหลังด้วย เช่น เม่นทะเลและดาวทะเล (ข้อ 3) ข้ออื่นถูกต้องทั้งหมด", "31": "แอกซอนใหญ่ขึ้นทำให้ <b>ความต้านทานไฟฟ้าภายในลดลง</b> (ผกผันกับพื้นที่ภาคตัดขวาง) ไอออนจึงไหลไปตามแอกซอนได้เร็วขึ้น กระแสประสาทเร็วขึ้น ข้อ 3 และ 4 ถูก ตอบข้อ 5", "32": "AP เป็นแบบ all-or-none และสร้างขึ้นใหม่ทีละตำแหน่งตลอดแอกซอน จึง<b>รักษาความรุนแรงเท่าเดิม</b>ไม่ว่าไปไกลแค่ไหน ตอบข้อ 4 <b>ข้อสังเกต:</b> ข้อ 2 ที่ว่า AP แรกไม่ใช่ AP เดียวกับ AP สุดท้ายก็มีเหตุผลรองรับเช่นกัน ข้อนี้น่าตรวจเทียบกับเฉลยทางการอีกครั้ง", "33": "เซลล์รูปโคนเป็น <b>โฟโตรีเซพเตอร์</b> (รับแสง สี) ไม่ใช่รีเซพเตอร์รับความดัน ข้อ 3 จึงจับคู่ผิด ข้ออื่นจับคู่ถูก", "34": "ถุงสารสื่อประสาทอยู่ที่ <b>ปลายแอกซอนของเซลล์ประสาทก่อนไซแนปส์</b> เมื่อ Ca²⁺ ไหลเข้า ถุงจะรวมกับเยื่อหุ้มเซลล์และปล่อยสารออกด้วยเอ็กโซไซโทซิส", "35": "Cl⁻ (ประจุลบ) แพร่เข้าเซลล์ทำให้ภายในเซลล์ลบมากขึ้น (hyperpolarization) เซลล์หลังไซแนปส์ถูกยับยั้ง เกิด <b>IPSP</b> ยากที่จะเกิด AP", "36": "ข้อ 3 ไม่ตรงกัน เพราะ <b>อินซูลินกระตุ้นการสร้างไกลโคเจน</b> (ลดน้ำตาลในเลือด) ส่วนการสลายไกลโคเจนในตับเป็นหน้าที่ของกลูคากอน", "37": "<b>ADH</b> (วาโซเพรสซิน) กระตุ้นการดูดน้ำกลับที่ท่อหน่วยไตจึงควบคุมระดับน้ำในร่างกาย ส่วน ACTH, FSH, GH, LH ไม่ได้ควบคุมน้ำโดยตรง", "38": "ออกซิโทซินถูก <b>สร้างที่ไฮโพทาลามัส</b> แล้วส่งตามแอกซอนไปเก็บและหลั่งที่ต่อมใต้สมองส่วนหลัง ไม่ได้สร้างที่ต่อมใต้สมองส่วนหลังเอง", "39": "อดอาหาร 24 ชม. น้ำตาลในเลือดต่ำ จึงมี <b>อินซูลินต่ำ และกลูคากอนสูง</b> เพื่อสลายไกลโคเจนและสร้างกลูโคสเพิ่ม", "40": "อสุจิสร้างในหลอดสร้างอสุจิ <b>seminiferous tubules</b> ของอัณฑะ ส่วน seminal vesicle, prostate, Cowper's/bulbourethral gland เป็นต่อมที่สร้างของเหลวในน้ำอสุจิ", "41": "<b>LH</b> กระตุ้น corpus luteum ในผู้หญิงให้สร้างโปรเจสเทอโรน และกระตุ้น interstitial cells (Leydig) ในผู้ชายให้สร้างเทสโทสเทอโรน ส่วน FSH กระตุ้นการเจริญของฟอลลิเคิลและการสร้างอสุจิ", "42": "การตกไข่เกิดจาก <b>LH surge</b> (การหลั่ง LH ปริมาณสูงอย่างรวดเร็ว) ซึ่งเป็นกลไกเดียวกับในคนและสัตว์เลี้ยงลูกด้วยนมส่วนใหญ่", "43": "หัวใจ หลอดเลือด กล้ามเนื้อ กระดูก และไต พัฒนามาจาก <b>mesoderm</b> ส่วน ectoderm สร้างระบบประสาทและผิวหนัง และ endoderm สร้างทางเดินอาหารและปอด", "44": "<b>ถุงน้ำเชื้อ (seminal vesicle)</b> สร้างฟรักโทสเป็นแหล่งพลังงานของอสุจิ รวมทั้งโพรสตาแกลนดิน ส่วนต่อมลูกหมากสร้างสารด่างช่วยลดความเป็นกรดในช่องคลอด", "45": "ข้อนี้ดูภาพเอ็มบริโอไก่ในข้อสอบ เฉลยคือข้อ 5 หลักคิด: <b>อัลแลนทอยส์</b> เก็บของเสีย (กรดยูริก) และทำงานร่วมกับ chorion ใกล้เปลือกไข่ในการแลกเปลี่ยนแก๊ส ส่วนถุงไข่แดงเก็บอาหาร และแอมนีออนห่อหุ้มกันกระแทก", "46": "พืชใบเลี้ยงเดี่ยวทุกชนิดมีรากแขนงแบบ <b>รากฝอย</b> ซึ่งเป็นรากพิเศษ (เช่น ข้าวโพด) และมะม่วงกิ่งตอนกับแพงพวยน้ำก็ออกรากพิเศษจากลำต้น ส่วนข้ออื่นมีพืชที่ใช้รากแก้วจากเมล็ด เช่น ถั่วเขียว มะม่วงเพาะเมล็ด มะละกอ", "47": "ลิกนินเสริมความแข็งแรงให้ผนังเซลล์ พบใน <b>เอนโดเดอร์มิส</b> (แถบแคสพาเรียน) และ <b>เนื้อไม้ (ไซเลม)</b> ส่วนเอ็มบริโอและเซลล์ผิวใบไม่เน้นลิกนิน", "48": "การคายน้ำของพืชใบเกิดที่ <b>ปากใบ</b> มากที่สุด (ประมาณ 90%) เลนทิเซลคายน้ำได้น้อยมาก และไฮดาโทดเป็นการกัตเตชัน ไม่ใช่การคายน้ำเป็นไอ", "49": "คลอโรฟิลล์มี <b>Mg</b> เป็นองค์ประกอบ มี <b>N</b> เป็นองค์ประกอบของโครงสร้างวงพอร์ไฟริน และ <b>Fe</b> จำเป็นต่อเอนไซม์สังเคราะห์คลอโรฟิลล์ จึงขาด N, Mg, Fe มีผลโดยตรง", "50": "ข้อนี้ดูกราฟในข้อสอบ เฉลยคือข้อ 1 (กราฟ A) หลักคิด: ศูนย์กลางปฏิกิริยา P680 และ P700 ดูดแสงสูงสุดที่ความยาวคลื่นสีแดง (ประมาณ 680 และ 700 นาโนเมตร) ให้เลือกกราฟที่ยอดสูงสุดอยู่ตรงช่วงนี้", "51": "ข้อนี้ดูภาพในคลอโรพลาสต์ในข้อสอบ เฉลยคือข้อ 2 หลักคิด: ให้แยกสารอนินทรีย์ (CO2, H2O, O2) ออกจากสารอินทรีย์ (น้ำตาล เช่น PGAL, RuBP, PGA) ที่เป็นผลผลิตของวัฏจักรคัลวิน", "52": "ข้อนี้ดูภาพกระบวนการในข้อสอบ เฉลยคือข้อ 3 หลักคิด: พืช C4 (ข้าวโพด บานไม่รู้โรย) ตรึง CO2 ที่ mesophyll แล้วส่งต่อให้ <b>bundle sheath</b> เพื่อทำวัฏจักรคัลวินตอนกลางวัน ข้าวเป็น C3 และว่านหางจระเข้เป็น CAM", "53": "P680 คือคลอโรฟิลล์ในศูนย์กลางปฏิกิริยาของ <b>ระบบแสง II (PSII)</b> ในพืชชั้นสูง ส่วน P700 คือ PSI <b>ข้อสังเกต:</b> ข้อ 1 (โมเลกุลคู่) ก็มีเหตุผลรองรับในตำราบางเล่ม จึงน่าตรวจเทียบกับเฉลยทางการ", "54": "14CO2 ถูกตรึงโดย RuBP ได้ PGA ก่อน แล้วถูกรีดิวซ์เป็น PGAL และบางส่วนเปลี่ยนกลับเป็น RuBP ตามวัฏจักรคัลวิน ลำดับคือ <b>PGA → PGAL → RuBP</b>", "55": "ดอกมะเขือเป็น <b>ดอกสมบูรณ์</b> (มีกลีบเลี้ยง กลีบดอก เกสรเพศผู้ เกสรเพศเมีย ครบ) ส่วนบัวเป็นดอกเดี่ยว ทานตะวันเป็นช่อดอก ตำลึงเป็นดอกแยกเพศ และฟักทองมีรังไข่ใต้ฐานรองดอก", "56": "เมล็ดเกิดจากการสืบพันธุ์แบบอาศัยเพศ จึงเกิดการรวมยีนใหม่ในลูกผสม ต้นที่ได้ <b>หลากหลายทางพันธุกรรมมากที่สุด</b> ส่วนใบ ราก ตายอด ล้วนเป็นเนื้อเยื่อร่างกายที่ให้โคลนเหมือนต้นแม่", "57": "เซลล์ <b>ไมโครสปอร์ที่เจริญเป็นเรณู</b> แบ่งแบบไมโทซิสอย่างเดียว ส่วนเซลล์ในอับเรณูที่เป็นสปอร์แม่และเซลล์ในออวูลที่สร้างเมกะสปอร์ต้องแบ่งแบบไมโอซิสก่อน", "58": "<b>ออกซิน</b> เร่งการเกิดราก จึงใช้ในการกิ่งตอนและปักชำ ส่วนไซโทไคนินเร่งการแตกตาข้าง จิบเบอเรลลินเร่งการยืดต้น", "59": "ปากใบเปิด-ปิดจากการเปลี่ยนความเต่งของเซลล์คุม การหลับของใบจามจุรีก็เกิดจากการเปลี่ยนความเต่งของเซลล์ที่ <b>พัลไวนัส</b> จึงเป็นกลไกเดียวกัน (turgor movement)", "60": "รากตอบสนองต่อแรงโน้มถ่วงแบบ <b>positive gravitropism</b> โดยใช้ออกซิน และการแตกพุ่มเกี่ยวข้องกับ <b>การเด่นของตายอด</b> ที่ออกซินจากตายอดยับยั้งตาข้าง จึงใช้ออกซินทั้งสองเหตุการณ์", "61": "พ่อแม่พันธุ์แท้ RRYY × rryy ได้ F1 = RrYy ผสมกันเองได้ 9 : 3 : 3 : 1 ส่วนที่มีสัดส่วน <b>9</b> คือ <b>มียีนเด่นทั้งสองคู่</b> ได้แก่ เมล็ดกลม สีเหลือง", "62": "ทดสอบพันธุ์ (testcross) คือการผสมกับ <b>ตัวที่เป็นพันธุ์แท้ลักษณะด้อย</b> (aabb) เพื่อดูว่าตัวที่ต้องการตรวจมีจีโนไทป์ใดจากลักษณะลูก ตัวเลือกที่ผสมกับ aabb คือข้อ 4 (AABB × aabb)", "63": "ลูกต้องเป็น homozygous ทุกตำแหน่ง: Aa ผสมตัวเองได้ AA หรือ aa = 1/2, Bb = 1/2, Cc = 1/2 และ dd × dd ได้ dd เสมอ = 1 ดังนั้น 1/2 × 1/2 × 1/2 × 1 = <b>1/8</b>", "64": "ลิ้นมังกรสีดอกเป็นแบบ <b>incomplete dominance</b> (แดง × ขาว ได้ชมพู) ผสมตัวเองของต้นสีชมพูได้ แดง : ชมพู : ขาว = 1 : 2 : 1 ตามเฉลยข้อ 5 ตีความว่าเมล็ดจากต้นดอกสีใดก็ตามเมื่อปลูกแล้วมีต้นที่สีเหมือนต้นเดิมเกิดขึ้นได้ <b>ข้อสังเกต:</b> หากตีความว่าต้องออกดอกสีเดิมทุกต้น คำตอบจะเป็นเฉพาะสีขาวและสีแดง (ข้อ 3) โจทย์ข้อนี้กำกวม ควรอธิบายให้นักเรียนทราบ", "65": "ข้อนี้ดูเพดดิกรีในข้อสอบ เฉลยคือข้อ 3 (I-1 และ II-3) หลักคิด: ตาบอดสีเป็นลักษณะด้อยบนโครโมโซม X ผู้หญิงที่ไม่เป็นโรคแต่มีลูกชายหรือพ่อที่เป็นโรคจะเป็นพาหะแน่นอน", "66": "ถ้ายีน A และ B <b>ลิงก์เกจ</b> (อยู่บนโครโมโซมเดียวกัน) ยีนจะไม่แยกอิสระ เซลล์สืบพันธุ์จึงไม่เป็น AB : Ab : aB : ab = 1 : 1 : 1 : 1 ตัวเลือกที่ถูกคือข้อ 5 ที่บอกว่าอัตราส่วนไม่เท่ากัน (≠ 1:1:1:1)", "67": "ข้อมูลพันธุกรรมเก็บอยู่ใน <b>ลำดับการเรียงของนิวคลีโอไทด์</b> (เบส A, T, G, C) ในสาย DNA ส่วนโครงสร้างน้ำตาลกับฟอสเฟตเป็นเพียงแกนหลัก", "68": "จากใหญ่ไปเล็ก: <b>โครโมโซม → ยีน → นิวคลีโอไทด์ → ไนโตรจีนัสเบส</b> โครโมโซมประกอบด้วยยีนหลายยีน ยีนประกอบด้วยนิวคลีโอไทด์ และนิวคลีโอไทด์ประกอบด้วยเบสไนโตรเจนอยู่ภายใน", "69": "ข้อนี้ดูภาพการจำลอง DNA ในข้อสอบ เฉลยคือข้อ 3 (C คือ lagging strand) หลักคิด: lagging strand สร้างเป็นชิ้นสั้น (Okazaki fragment) ย้อนทิศทางการเปิดเกลียว ส่วน leading strand สร้างต่อเนื่อง", "70": "ขั้นต่อสาย (elongation) คือ tRNA ที่มีแอนติโคดอนเข้าจับกับโคดอนบน mRNA นำกรดอะมิโนมาต่อเข้ากับสายพอลิเพปไทด์ ข้ออื่นเป็นขั้นเริ่มต้น (initiation) หรือขั้นสิ้นสุด (termination)", "71": "DNA สายคู่จับคู่ A=T และ G≡C เสมอ จึงได้ (A+G) = (T+C) → <b>(A+G)/(C+T) = 1</b> และ (G+T) = (A+C) → <b>(G+T)/(A+C) = 1</b> ส่วน (A+T)/(G+C) จะเท่ากับ 1 เฉพาะเมื่อ GC = 50%", "72": "mRNA คือ CCU CUU CCU CUU… (5′→3′) สายแม่แบบ DNA ต้องเข้าคู่แบบตรงข้ามทิศกัน จึงเป็น <b>3′ GGA GAA GGA GAA…5′</b> (จับคู่ C→G และ U→A)", "73": "Frameshift คือการเติมหรือขาดหายของเบสที่ไม่ใช่ผลคูณของ 3 ทำให้การอ่านรหัสเลื่อนกรอบ ข้อ 2 (THE ATA TET HER) เกิดจากการขาดตัวอักษร C ทำให้อ่านกรอบเปลี่ยนไปทั้งประโยค ส่วนข้อ 1 และ 3 ขาดทั้งคำ (ไม่เลื่อนกรอบ) และข้อ 4, 5 เป็นการแทนที่ตัวอักษร", "74": "ยีนเด่นแต่ละตัวเพิ่มความเข้มของสีแบบสะสม ลูกจะเข้มกว่าพ่อแม่ได้ต้องมีจำนวนยีนเด่นรวมมากกว่าทั้งสองฝ่าย ข้อ 3: AaBbcc (เด่น 2 ตัว) × aabbCc (เด่น 1 ตัว) ลูกอาจได้ AaBbCc (เด่น 3 ตัว) ซึ่งมากกว่าทั้งคู่ ข้ออื่นลูกมียีนเด่นไม่เกินพ่อหรือแม่ฝ่ายใดฝ่ายหนึ่ง", "75": "ออโตทริพลอยด์ (3n) มีโครโมโซมเหมือนกัน 3 ชุด ในไมโอซิสโฮโมโลกัสโครโมโซมจับคู่ได้ไม่สมบูรณ์ (จับกันเป็นกลุ่ม 3 แท่ง) ทำให้แยกเป็นเซลล์สืบพันธุ์ที่มีโครโมโซมไม่สมดุล จึงมักเป็นหมัน", "76": "พันธุวิศวกรรมคือการตัดต่อและถ่ายยีน การสร้างวัวที่ผลิตนมที่มี growth hormone ของมนุษย์ต้องย้ายยีนมนุษย์เข้าวัว ส่วนการโคลนนิ่ง การปั่นตา และการตรวจลายพิมพ์ DNA/RFLP ไม่ได้ตัดต่อยีน", "77": "พลาสมิดเป็นวงกลม เมื่อถูกเอนไซม์ตัดที่ 2 ตำแหน่งจะได้ <b>DNA สายตรง 2 ชิ้น</b> ข้อนี้ดูแผนที่ตำแหน่งตัดของ EcoRI ในข้อสอบ เฉลยคือข้อ 4 (สายตรง 1.7 และ 5.5 kb) ถ้าตัดที่ตำแหน่งเดียวจะได้สายตรง 1 ชิ้น", "78": "ข้อนี้ดูภาพตำแหน่งยีนและไพรเมอร์ในข้อสอบ เฉลยคือข้อ 5 (PCR ด้วยไพรเมอร์ C และ D) หลักคิด: PCR สามารถเลือกขยายเฉพาะช่วงยีน N ได้แม่นยำด้วยไพรเมอร์ที่ขนาบยีนนั้น ส่วนการตัดด้วยเอนไซม์อาจได้ชิ้น DNA ที่มีส่วนที่ไม่ใช่ยีนติดมาด้วย", "79": "พลาสมิดต้องเป็น DNA วงกลมสายคู่ที่เป็นเกลียวคู่ และมี origin of replication เพื่อจำลองตัวเองได้ แต่ <b>ยีนต้านยาปฏิชีวนะ</b> ไม่จำเป็นต้องมีทุกพลาสมิด (ใช้เป็นเครื่องหมายคัดเลือกในพลาสมิดที่ใช้ในแล็บ)", "80": "การปรับปรุงพันธุ์พืชโดยใช้ <b>เครื่องหมายโมเลกุล</b> (molecular marker) ใช้ลำดับ DNA ตรวจหายีนที่ต้องการ จึงเกี่ยวข้องกับ DNA มากที่สุด ส่วนการถ่ายฝากตัวอ่อน ผสมเทียม เคมีบำบัด สกัดสาร ไม่ได้ใช้ DNA เป็นหลัก", "81": "<b>⚠️ ข้อนี้เฉลยในไฟล์ (ข้อ 2) ไม่ตรงกับผลคำนวณ ควรตรวจสอบ</b> วิธีคิด: ประชากรเริ่มต้น AA 90 คน, aa 10 คน ความถี่ของอัลลีล p(A) = 0.9, q(a) = 0.1 เมื่อเข้าสู่สมดุลฮาร์ดี–ไวน์เบิร์กและขนาดเท่าเดิม (100 คน): AA = p² × 100 = 81, Aa = 2pq × 100 = 18, aa = q² × 100 = 1 ซึ่งตรงกับ <b>ตัวเลือกข้อ 4</b> ส่วนข้อ 2 (AA 90, aa 10) คือประชากรเริ่มต้นเอง ในไฟล์เฉลยข้อนี้ตัวเลขไม่ถูกทำตัวหนา จึงอาจเป็นข้อที่ยังไม่ยืนยัน", "82": "แนวคิดสปีชีส์ทางชีววิทยา (biological species concept) ใช้ <b>การผสมพันธุ์กันได้ในธรรมชาติและให้ลูกที่ไม่เป็นหมัน</b> เป็นเกณฑ์ ไม่ได้ใช้ลักษณะภายนอกอย่างเดียว", "83": "การคัดเลือกโดยธรรมชาติทำให้เกิดการดื้อยา การดื้อสารฆ่าแมลง และการเกิดสปีชีส์ใหม่ แต่ <b>การเกิดพอลิพลอยด์</b> เกิดจากความผิดปกติของการแบ่งเซลล์ (มิวเทชัน) ไม่ใช่การคัดเลือกโดยธรรมชาติ", "84": "สมมติฐานกำเนิดมนุษย์ปัจจุบันมี 2 แนวคิดหลัก คือ <b>multiregional</b> (มนุษย์ปัจจุบันของแต่ละภูมิภาคพัฒนามาจากบรรพบุรุษกลุ่มก่อนหน้าในภูมิภาคนั้น) และ <b>out of Africa</b> (H. sapiens กำเนิดในแอฟริกาแล้วกระจายไปแทนที่กลุ่มอื่น) เฉลยในไฟล์คือข้อ 5 ซึ่งเป็นข้อที่เปรียบเทียบสองสมมติฐานนี้ได้ใกล้เคียงที่สุดในตัวเลือก", "85": "สองสปีชีส์พบในที่เดียวกัน ลักษณะภายนอกคล้ายกันมาก ต่างกันที่ <b>เสียงร้อง</b> ซึ่งใช้เรียกคู่ผสมพันธุ์ จึงเป็นการแยกกันทางสืบพันธุ์ด้านพฤติกรรม (behavioral isolation)", "86": "หนอนลำตัวเป็นปล้อง มีระบบไหลเวียนเลือดแบบปิด มีทั้งปากและทวารหนัก ไม่มีโครงร่างแข็งภายนอก คือ <b>ไฟลัมแอนเนลิดา</b> (เช่น ไส้เดือนดิน) ส่วนอาร์โทรโปดามีโครงร่างภายนอกและระบบไหลเวียนเลือดแบบเปิด", "87": "ลำดับการจัดหมวดหมู่ย่อยลงมาคือ อาณาจักร → ไฟลัม/ดิวิชัน → คลาส → ออร์เดอร์ → วงศ์ → สกุล → สปีชีส์ หน่วยที่เล็กกว่ามีลักษณะคล้ายกันมากกว่า สิ่งมีชีวิตใน <b>สกุลเดียวกัน</b> จึงคล้ายกันมากที่สุดในตัวเลือก", "88": "ยูคาริโอตที่มีผนังเซลล์แต่ไม่มีคลอโรพลาสต์ (ไม่สังเคราะห์ด้วยแสง) คือ <b>อาณาจักรเห็ดรา (Fungi)</b> ผนังเซลล์เป็นไคทิน ส่วนไฟลัมคอร์ดาตาไม่มีผนังเซลล์ และมอเนราเป็นโพรคาริโอต", "89": "ราเมือกเป็นโพรทิสต์ (ไม่ใช่ฟังไจ) ที่ดำรงชีวิตแบบ <b>ผู้ย่อยสลาย</b> สารอินทรีย์ในระบบนิเวศ อะมีบาไม่ใช่ราเมือก และระยะพลาสโมเดียมเป็นระยะกินอาหาร ไม่ใช่ระยะสร้างสปอร์", "90": "แอมฟิออกซัสเป็นคอร์ดาตาไม่มีกระดูกสันหลัง ส่วนปลากระดูกแข็งเป็นสัตว์มีกระดูกสันหลัง สิ่งที่เหมือนกันตามลักษณะของไฟลัมคอร์ดาตาคือ <b>ท่อประสาทกลวงด้านหลัง</b> (dorsal hollow nerve cord) ส่วนกระดูกสันหลัง ขากรรไกร เกล็ด ถุงลม พบเฉพาะในปลากระดูกแข็ง", "91": "สิ่งมีชีวิตหลายชนิดอยู่ใน <b>ลำดับขั้นการกินเดียวกัน</b> ได้ เช่น วัวและกระต่ายเป็นผู้บริโภคลำดับที่ 1 ส่วนไส้เดือนดินเป็นผู้ย่อยสลาย และหม้อข้าวหม้อแกงลิงเป็นผู้ผลิตที่ได้ไนโตรเจนเสริมจากแมลง", "92": "แผนภาพเริ่มจากไลเคนบนพื้นที่เปล่า จึงเป็นการเปลี่ยนแปลงแทนที่แบบ <b>ปฐมภูมิ</b> (ข้อ 1 ผิด) สังคมสมบูรณ์ (climax) คือขั้นสุดท้ายซึ่งคือป่าผลัดใบเขตอบอุ่น (ข้อ 2 ผิด) จึงเป็นกลุ่มที่ดำรงอยู่ยาวนานที่สุด ข้อ 4 ถูก ส่วนข้อ 3 และ 5 ระบุเกินจริง", "93": "อัตราเกิด อัตราตาย ความหนาแน่น และโครงสร้างอายุ ล้วนมีผลโดยตรงต่อขนาดประชากร ส่วน <b>รูปแบบการแพร่กระจาย</b> (สุ่ม สม่ำเสมอ เป็นกลุ่ม) มีผลต่อการเพิ่มของประชากรน้อยที่สุด", "94": "สารพิษที่สะสมในร่างกายจะมีความเข้มข้นสูงขึ้นตามลำดับขั้นการกิน (biomagnification) สิ่งมีชีวิตที่อยู่ <b>ยอดพีระมิดนิเวศ</b> จึงสะสมสารพิษสูงที่สุด", "95": "เมื่อขึ้นที่สูงอุณหภูมิลดลง ไบโอมเปลี่ยนจากป่าดิบชื้น → ป่าผลัดใบเขตอบอุ่น → ป่าสน (ป่าไทกา) ตามลำดับความหนาวเย็น ส่วนทุนดราไม่พบในประเทศไทย ข้อ 5 จึงผิด", "96": "พืชมีเซลลูโลสสูง ทำให้สัตว์กินพืช <b>ย่อยได้ไม่ดี</b> (ประสิทธิภาพการย่อยต่ำ) จึงดูดซึมพลังงานได้น้อยเมื่อเทียบกับปริมาณอาหารที่กิน ส่วนทางเดินอาหารของสัตว์กินพืชมักยาวกว่าสัตว์กินเนื้อ", "97": "ใช้วิธีจับ-ติดเครื่องหมาย-จับซ้ำ (Lincoln–Petersen): จำนวนประชากร = (จำนวนที่ติดเครื่องหมายครั้งแรก × จำนวนที่จับครั้งที่สอง) ÷ จำนวนที่มีเครื่องหมายในครั้งที่สอง = (100 × 100) ÷ 20 = <b>500 ตัว</b>", "98": "การล่าเหยื่อเป็นแรงคัดเลือก ตั๊กแตนที่พรางตัวคล้ายกิ่งหรือใบไม้จะรอดจากผู้ล่าและถ่ายทอดลักษณะนี้ จึงเกิดวิวัฒนาการแบบ <b>กา
